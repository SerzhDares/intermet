<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/style.css">
    <script defer src="js/main.js"></script>
    <title>Интермет</title>
</head>
<body>
    <div class="running_line_color">
        <div class="container running_line-container">
            <div class="running_line">
                <span class="running_line-text">Уважаемые поставщики, цены на металлолом указаны на сегодня</span>
                <span class="running_line-text">Уважаемые поставщики, цены на металлолом указаны на сегодня</span>
            </div>
        </div>
    </div>
    <div class="container">
        <div class="phone_block">
            <a href="tel:88124436206" class="phone_link">8 (812) 443-62-06</a>
        </div>
        <div class="nav_block">
            <a href="#" class="logo_link">
                <img src="/imgs/logo.png" alt="ИНТЕРМЕТ" class="logo">
            </a>
            <div class="icons_block">
                <button class="search_btn" type="button"></button>
                <div class="socials_block">
                    <a href="https://wa.me/#" class="social_link">
                        <img src="/imgs/whatsapp.svg" alt="WhatsApp" class="social_icon">
                    </a>
                    <a href="https://t.me/#" class="social_link">
                        <img src="/imgs/telegram.svg" alt="Telegram" class="social_icon">
                    </a>
                    <a href="https://t.me/#" class="social_link">
                        <img src="/imgs/max.svg" alt="Telegram" class="social_icon">
                    </a>
                </div>
                <button class="burger_btn" type="button"></button>
            </div>
        </div>
    </div>
    <div class="banner_color_block">
        <div class="container">
            <div class="banner_block">
                <div class="left_banner_block">
                    <h1 class="banner_title">узнай цену <span class="banner_title_bold">за 5 минут</span></h1>
                    <span class="banner_text">Пришли фото в Telegram — мы оценим и предложим лучшую цену</span>
                    <div class="banner_buttons_block">
                        <button class="banner_btn banner_btn_tlg">Узнать стоимость</button>
                        <button class="banner_btn banner_btn_load">Загрузить фото</button>
                    </div>
                </div>
                <div class="banner_imgs_block">
                    <img src="/imgs/iphone.png" alt="iphone" class="iphone">
                    <img src="/imgs/present1.svg" alt="present" class="present">
                </div>
            </div>
        </div>
    </div>
    <div class="advantages_block">
        <div class="container">
            <div class="advantages">
                <img src="/imgs/adv_1.svg" alt="Более 10 лет" class="advantage">
                <img src="/imgs/adv_2.svg" alt="Оплата" class="advantage">
                <img src="/imgs/adv_3.svg" alt="Консультации" class="advantage">
                <img src="/imgs/adv_4.svg" alt="Цены онлайн" class="advantage">
                <img src="/imgs/adv_5.svg" alt="Точность" class="advantage">
                <img src="/imgs/adv_6.svg" alt="6 площадок" class="advantage">
            </div>
        </div>
    </div>
    <div class="load_block">
        <div class="container">
            <div class="load_field_border">
                <div class="load_field">Загрузить фото / Узнать цену</div>
            </div>
        </div>
    </div>
    <div class="services_block">
        <div class="container">
            <div class="services_top-block">
                <h2 class="block_title">Услуги</h2>
                <div class="services_top-right">
                    <img src="/imgs/services_passport.svg" alt="При первом визите возьмите паспорт" class="services_title_img">
                    <button class="button_all">Все</button>
                </div>
            </div>
            <div class="services">
                <img src="/imgs/serv_1.svg" alt="Вывоз цветного лома" class="service">
                <img src="/imgs/serv_2.svg" alt="Демонтаж" class="service">
                <img src="/imgs/serv_3.svg" alt="Химанализ" class="service">
                <img src="/imgs/serv_4.svg" alt="Прием металла" class="service">
            </div>
        </div>
    </div>
    <div class="price_button_block">
        <div class="container">
            <button class="price_button">Посмотреть цены</button>
        </div>
    </div>
</body>
</html>
